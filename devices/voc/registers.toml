# Imported from the former KONA_VOC_DECODE.h. Review the sources and grades, then maintain by hand.
unit = "voc"
prefix = "VOC"
title = "video-output chip (VOC) registers"
doc = "Video-output chip registers of channel id 0 on the display bus."
from = "back-end definitions table, formats/token/command-table.md section 6.5"

