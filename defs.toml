[project]
name = "kona"
plugin = "scripts/kona_checks.py"
regenerate = "retools/tools/defs/gen_decode_rust.py --config defs.toml"

[rust]
out_dir = "generated/kona-regs"

[banned]
allow_includes = ["stdint.h"]

[[headers]]
file = "KONA_QUERY_DECODE.h"
form = "regs"
group = "kona-tokens"
module = "query"
rust_prefix = "KONA_QUERY_"
register_doc = "Query token"
description = ["Host query tokens of the InfiniteReality2 pipe: the tokens a client", "writes to read state back from the pipe."]

[[headers]]
file = "KONA_TOKEN_DECODE.h"
form = "regs"
group = "kona-tokens"
module = "token"
rust_prefix = "KONA_TOKEN_"
register_doc = "Host token"
description = ["Host command tokens of the InfiniteReality2 pipe other than the", "queries: processor-run and hardware-routed tokens."]

[[headers]]
file = "KONA_XMAP_DECODE.h"
block = "XMAP"
form = "regs"
group = "kona-xmap"
notes_corpus = ["docs/command-table.md"]
module = "xmap"
rust_prefix = "XMAP_"
register_doc = "Display-bus register"
description = ["XMAP direct registers, indirect-memory ports and the words", "written through them."]

[[headers]]
file = "KONA_VOC_DECODE.h"
block = "VOC"
form = "regs"
group = "kona-voc"
module = "voc"
rust_prefix = "VOC_"
register_doc = "Display-bus register"
description = ["Video-output chip registers of channel id 0 on the display bus."]

[[headers]]
file = "KONA_DAC_DECODE.h"
block = "DAC"
form = "regs"
group = "kona-dac"
module = "dac"
rust_prefix = "DAC_"
register_doc = "Display-bus register"
description = ["Video DAC and encoder ports of the display bus."]

[[headers]]
file = "KONA_DACIDX_DECODE.h"
form = "regs"
prefix = "DACIDX"
group = "kona-dac"
module = "dacidx"
rust_prefix = "DACIDX_"
register_doc = "Indexed register"
description = ["Indexed registers behind the video DAC and encoder ports, and the", "DAC cursor control word."]

[[headers]]
file = "KONA_DISPREQ_DECODE.h"
form = "regs"
prefix = "DISPREQ"
group = "kona-dispreq"
module = "dispreq"
rust_prefix = "DISPREQ_"
register_doc = "Display request"
description = ["Display-generator request numbers: payload word counts and reply", "types."]

[[headers]]
file = "KONA_WORDS_DECODE.h"
form = "regs"
prefix = "WORD"
group = "kona-words"
notes_corpus = ["docs/command-table.md"]
module = "words"
rust_prefix = "WORD_"
register_doc = "Word"
description = ["Bit layouts of the multi-field words of the host command stream."]

[[claims]]
group = "kona-xmap"
label = "cursor position fields"
doc = "docs/command-table.md"
regex = 'bits (\d+):(\d+) = x - hot x - rectangle x1 \+ 32; bits (\d+):(\d+) = y'
binds = [["F", "XMAP.cursor_pos.x", 1, 2], ["F", "XMAP.cursor_pos.y", 3, 4]]
[[claims]]
group = "kona-xmap"
label = "display-id entry colour map base"
doc = "docs/command-table.md"
regex = '\| (\d+):(\d+) \| colour-map base:'
binds = [["F", "XMAP.did_data.cmap_base", 1, 2]]
[[claims]]
group = "kona-xmap"
label = "display-id entry planes"
doc = "docs/command-table.md"
regex = '\| (\d+):(\d+) \| number of index planes minus 1'
binds = [["F", "XMAP.did_data.planes_minus_1", 1, 2]]
[[claims]]
group = "kona-xmap"
label = "display-id entry flags"
doc = "docs/command-table.md"
regex = '\| (\d+) \| luminance visual flag.*?\| (\d+) \| grey visual flag'
binds = [["F", "XMAP.did_data.luminance", 1], ["F", "XMAP.did_data.grey", 2]]
[[claims]]
group = "kona-xmap"
label = "channel set-up gamma page"
doc = "docs/command-table.md"
regex = '\| (\d+):(\d+) \| gamma page'
binds = [["F", "XMAP.chan_setup.gamma_page", 1, 2]]
[[claims]]
group = "kona-xmap"
label = "channel set-up flags"
doc = "docs/command-table.md"
regex = '\| (\d+) \| external gamma \|.*?\| (\d+) \| no gamma \|.*?\| (\d+) \| alpha to blue'
binds = [["F", "XMAP.chan_setup.ext_gamma", 1], ["F", "XMAP.chan_setup.no_gamma", 2], ["F", "XMAP.chan_setup.alpha_to_blue", 3]]
[[claims]]
group = "kona-xmap"
label = "gamma address entry, colour, page"
doc = "docs/command-table.md"
regex = '\| (\d+):(\d+) \| entry index.*?\| (\d+):(\d+) \| colour \|.*?\| (\d+):(\d+) \| page'
binds = [["F", "XMAP.ind_addr.entry", 1, 2], ["F", "XMAP.ind_addr.colour", 3, 4], ["F", "XMAP.ind_addr.page", 5, 6]]
[[claims]]
group = "kona-xmap"
label = "gamma address flag"
doc = "docs/command-table.md"
regex = '\| (\d+) \| extended gamma addressing flag'
binds = [["F", "XMAP.ind_addr.flag", 1]]
[[claims]]
group = "kona-xmap"
label = "colour word fields"
doc = "docs/command-table.md"
regex = 'colour-map entries are 10:10:10 with red (\d+):(\d+), green (\d+):(\d+), blue (\d+):(\d+)'
binds = [["F", "XMAP.cmap_data.red", 1, 2], ["F", "XMAP.cmap_data.green", 3, 4], ["F", "XMAP.cmap_data.blue", 5, 6]]

[[claims]]
group = "kona-voc"
label = "control pixel mux"
doc = "docs/command-table.md"
regex = 'bits (\d+):(\d+) output pixel mux'
binds = [["F", "VOC.control.pixel_mux", 1, 2]]
[[claims]]
group = "kona-voc"
label = "control double-buffer mode"
doc = "docs/command-table.md"
regex = 'control: bits (\d+):(\d+) double-buffer control mode'
binds = [["F", "VOC.control.dbuf_mode", 1, 2]]
[[claims]]
group = "kona-voc"
label = "status field-sequential colour field"
doc = "docs/command-table.md"
regex = 'bits (\d+):(\d+) field-sequential colour field'
binds = [["F", "VOC.status.fs_colour_field", 1, 2]]
[[claims]]
group = "kona-voc"
label = "requester window"
doc = "docs/command-table.md"
regex = 'bits (\d+):(\d+) channel id, bits (\d+):(\d+) screen width'
binds = [["F", "VOC.req_window.channel", 1, 2], ["F", "VOC.req_window.width_groupxels_m1", 3, 4]]
[[claims]]
group = "kona-voc"
label = "sequencer control"
doc = "docs/command-table.md"
regex = 'bit (\d+) enable; bits (\d+):(\d+) reset source.*?bits (\d+):(\d+) line-edge select.*?bits (\d+):(\d+) reset rate'
binds = [["F", "VOC.seq_control.enable", 1], ["F", "VOC.seq_control.reset_source", 2, 3], ["F", "VOC.seq_control.line_edge_select", 4, 5], ["F", "VOC.seq_control.reset_rate", 6, 7]]
[[claims]]
group = "kona-voc"
label = "sequencer initial levels"
doc = "docs/command-table.md"
regex = 'bits (\d+):(\d+) initial level of the 14 signals.*?bits (\d+), (\d+), (\d+) tri-state CSYNC, HSYNC, VSYNC.*?bits (\d+):(\d+) vertical-phase count'
binds = [["F", "VOC.seq_initial.initial_levels", 1, 2], ["F", "VOC.seq_initial.tristate_csync", 3], ["F", "VOC.seq_initial.tristate_hsync", 4], ["F", "VOC.seq_initial.tristate_vsync", 5], ["F", "VOC.seq_initial.vphase_count", 6, 7]]
[[claims]]
group = "kona-voc"
label = "genlock vertical phase"
doc = "docs/command-table.md"
regex = 'bits (\d+):(\d+) internal vertical phase; (\d+):(\d+) external vertical phase; (\d+):(\d+) hysteresis width; (\d+) hysteresis enable'
binds = [["F", "VOC.genlock_vphase.internal_vphase", 1, 2], ["F", "VOC.genlock_vphase.external_vphase", 3, 4], ["F", "VOC.genlock_vphase.hysteresis_width", 5, 6], ["F", "VOC.genlock_vphase.hysteresis_enable", 7]]
[[claims]]
group = "kona-voc"
label = "line type B"
doc = "docs/command-table.md"
regex = 'length minus 3 in (\d+):(\d+), edge mask for edges 32-49 in (\d+):(\d+)'
binds = [["F", "VOC.line_type_b.length_m3", 1, 2], ["F", "VOC.line_type_b.edge_mask_hi", 3, 4]]
[[claims]]
group = "kona-voc"
label = "edge slot position"
doc = "docs/command-table.md"
regex = 'edge position in (\d+):(\d+), 0x1fff = unused'
binds = [["F", "VOC.edge_slot.position", 1, 2]]
[[claims]]
group = "kona-voc"
label = "pixel blank"
doc = "docs/command-table.md"
regex = 'pixel blank: bits (\d+):(\d+) first, bits (\d+):(\d+) last, bit (\d+) enable'
binds = [["F", "VOC.pixel_blank.first", 1, 2], ["F", "VOC.pixel_blank.last", 3, 4], ["F", "VOC.pixel_blank.enable", 5]]
[[claims]]
group = "kona-voc"
label = "phase-frequency detector"
doc = "docs/command-table.md"
regex = 'bit 0 enable, bit 1 flip, bits (\d+):(\d+) clock select.*?bit (\d+) frame select.*?bits (\d+):(\d+) comparator precision, bits (\d+):(\d+) line count, bits (\d+):(\d+) composite-sync source.*?bits (\d+):(\d+) line count high'
binds = [["F", "VOC.pfd_control.clock_select", 1, 2], ["F", "VOC.pfd_control.frame_select", 3], ["F", "VOC.pfd_control.precision", 4, 5], ["F", "VOC.pfd_control.line_count", 6, 7], ["F", "VOC.pfd_control.csync_source", 8, 9], ["F", "VOC.pfd_control.line_count_hi", 10, 11]]
[[claims]]
group = "kona-voc"
label = "sync-detect control"
doc = "docs/command-table.md"
regex = 'bit 0 enable, bits (\d+):(\d+) line count, bits (\d+):(\d+) frames off, bits (\d+):(\d+) frames on, bit (\d+) frame-reference select'
binds = [["F", "VOC.sync_detect_control.line_count", 1, 2], ["F", "VOC.sync_detect_control.frames_off", 3, 4], ["F", "VOC.sync_detect_control.frames_on", 5, 6], ["F", "VOC.sync_detect_control.frame_ref_select", 7]]
[[claims]]
group = "kona-voc"
label = "requester control"
doc = "docs/command-table.md"
regex = 'bits (\d+):(\d+) pixel size.*?bit (\d+) dither, bit (\d+) transfer size.*?bit (\d+) transfer alpha, bit (\d+) transfer Z, bits (\d+):(\d+) FIFO balance, bit (\d+) arbiter status, bit (\d+) interlaced cursor'
binds = [["F", "VOC.req_control.pixel_size", 1, 2], ["F", "VOC.req_control.dither", 3], ["F", "VOC.req_control.transfer_size", 4], ["F", "VOC.req_control.transfer_alpha", 5], ["F", "VOC.req_control.transfer_z", 6], ["F", "VOC.req_control.fifo_balance", 7, 8], ["F", "VOC.req_control.arbiter_status", 9], ["F", "VOC.req_control.interlaced_cursor", 10]]
[[claims]]
group = "kona-voc"
label = "line request words"
doc = "docs/command-table.md"
regex = 'tiles-1 in (\d+):(\d+), groupxels-1 in (\d+):(\d+), valid bit (\d+)'
binds = [["F", "VOC.line_start.tiles_m1", 1, 2], ["F", "VOC.line_start.groupxels_m1", 3, 4], ["F", "VOC.line_start.valid", 5]]
[[claims]]
group = "kona-voc"
label = "middle line repeat"
doc = "docs/command-table.md"
regex = 'repeat count in (\d+):(\d+)'
binds = [["F", "VOC.line_middle.repeat_count", 1, 2]]
[[claims]]
group = "kona-voc"
label = "pan"
doc = "docs/command-table.md"
regex = 'bits (\d+):(\d+) groupxel offset = \(x mod 160\) / 4; bits (\d+):(\d+) pixel offset'
binds = [["F", "VOC.pan.groupxel_offset", 1, 2], ["F", "VOC.pan.pixel_offset", 3, 4]]
[[claims]]
group = "kona-voc"
label = "per-field start"
doc = "docs/command-table.md"
regex = 'bits (\d+):(\d+) start line, bits (\d+):(\d+) first tile address, bits (\d+):(\d+) skip count'
binds = [["F", "VOC.field_start0.start_line", 1, 2], ["F", "VOC.field_start0.first_tile", 3, 4], ["F", "VOC.field_start0.skip", 5, 6]]
[[claims]]
group = "kona-voc"
label = "field pattern"
doc = "docs/command-table.md"
regex = 'bits (\d+):(\d+) active lines; bits (\d+):(\d+) next-cursor offset'
binds = [["F", "VOC.field_pattern.active_lines", 1, 2], ["F", "VOC.field_pattern.next_cursor_offset", 3, 4]]
[[claims]]
group = "kona-voc"
label = "genlock clock"
doc = "docs/command-table.md"
regex = 'bit 0 clock source \(0 external, 1 internal\), bit (\d+) auto clock, bits (\d+):(\d+) horizontal-rate divider'
binds = [["F", "VOC.genlock_hclock.auto_clock", 1], ["F", "VOC.genlock_hclock.h_divider", 2, 3]]
[[claims]]
group = "kona-voc"
label = "genlock line ratio"
doc = "docs/command-table.md"
regex = 'bits (\d+):(\d+) line length, bits (\d+):(\d+) divider'
binds = [["F", "VOC.genlock_line_ratio.line_length", 1, 2], ["F", "VOC.genlock_line_ratio.divider", 3, 4]]
[[claims]]
group = "kona-voc"
label = "horizontal mask 2"
doc = "docs/command-table.md"
regex = 'start (\d+):(\d+), width (\d+):(\d+); 0x84'
binds = [["F", "VOC.hmask2.start", 1, 2], ["F", "VOC.hmask2.width", 3, 4]]
[[claims]]
group = "kona-voc"
label = "back-porch clamp"
doc = "docs/command-table.md"
regex = 'delay (\d+):(\d+), width (\d+):(\d+) \(8 bits'
binds = [["F", "VOC.backporch_clamp.delay", 1, 2], ["F", "VOC.backporch_clamp.width", 3, 4]]
[[claims]]
group = "kona-voc"
label = "FIFO control"
doc = "docs/command-table.md"
regex = 'bits (\d+):(\d+) high water, bit (\d+) frame-reset enable, bit (\d+) field-reset enable, bit (\d+) external control enable, bit (\d+) interrupt source'
binds = [["F", "VOC.fifo_control.high_water", 1, 2], ["F", "VOC.fifo_control.frame_reset_enable", 3], ["F", "VOC.fifo_control.field_reset_enable", 4], ["F", "VOC.fifo_control.ext_control_enable", 5], ["F", "VOC.fifo_control.int_source_odd", 6]]
[[claims]]
group = "kona-voc"
label = "FIFO pointer"
doc = "docs/command-table.md"
regex = 'write pointer (\d+):(\d+), read pointer (\d+):(\d+)'
binds = [["F", "VOC.fifo_pointer.write_ptr", 1, 2], ["F", "VOC.fifo_pointer.read_ptr", 3, 4]]
[[claims]]
group = "kona-voc"
label = "scaler control"
doc = "docs/command-table.md"
regex = 'bits (\d+):(\d+) X filter.*?bits (\d+):(\d+) Y filter.*?bits (\d+):(\d+) segment-switch preload, bit (\d+) interlace.*?bits (\d+):(\d+) encoder frame mode.*?, bit (\d+) encoder stereo mode, bits (\d+):(\d+) vertical-minify kick, bits (\d+):(\d+) first-field inhibit'
binds = [["F", "VOC.scaler_control.x_filter", 1, 2], ["F", "VOC.scaler_control.y_filter", 3, 4], ["F", "VOC.scaler_control.seg_preload", 5, 6], ["F", "VOC.scaler_control.interlace", 7], ["F", "VOC.scaler_control.enc_frame_mode", 8, 9], ["F", "VOC.scaler_control.enc_stereo_mode", 10], ["F", "VOC.scaler_control.vminify_kick", 11, 12], ["F", "VOC.scaler_control.first_field_inhibit", 13, 14]]
[[claims]]
group = "kona-words"
label = "mode byte flags"
doc = "docs/command-table.md"
regex = '\| (\d+) \| back buffer shown.*?\| (\d+) \| stereo \(main planes\).*?\| (\d+) \| non-colour-index RGB below 24 bits.*?\| (\d+) \| colour index or luminance.*?\| (\d+) \| direct colour'
binds = [["F", "MODE_BYTE.back_shown", 1], ["F", "MODE_BYTE.stereo", 2], ["F", "MODE_BYTE.rgb_below_24", 3], ["F", "MODE_BYTE.ci_or_luminance", 4], ["F", "MODE_BYTE.direct_or_opaque", 5]]
[[claims]]
group = "kona-words"
label = "overlay code"
doc = "docs/command-table.md"
regex = '\| (\d+):(\d+) for overlays \| overlay code'
binds = [["F", "MODE_BYTE_OVERLAY.code", 1, 2]]
[[claims]]
group = "kona-words"
label = "window width and bias"
doc = "docs/command-table.md"
regex = 'width \(low half\) and screen-space x bias \(high half\) \| (\d+):(\d+) width, (\d+):(\d+) bias'
binds = [["F", "WINDOW_W2.width", 1, 2], ["F", "WINDOW_W2.x_bias", 3, 4]]
[[claims]]
group = "kona-words"
label = "texel-draw size exponents"
doc = "docs/command-table.md"
regex = '\| 16 \| physical size exponents.*?\| (\d+):(\d+) s, (\d+):(\d+) t, (\d+):(\d+) r; each is a log2 size'
binds = [["F", "TEXLOAD_SIZE.s_exp", 1, 2], ["F", "TEXLOAD_SIZE.t_exp", 3, 4], ["F", "TEXLOAD_SIZE.r_exp", 5, 6]]
[[claims]]
group = "kona-words"
label = "texel-draw layout"
doc = "docs/command-table.md"
regex = '\| (\d+):(\d+) texel size code; (\d+) DMA flag.*?; (\d+) bank bit \(.*?; (\d+):(\d+) layout mode; (\d+):(\d+) s address bits and (\d+):(\d+) t address bits.*?; (\d+) interlaced download'
binds = [["F", "TEXLOAD_LAYOUT.size_code", 1, 2], ["F", "TEXLOAD_LAYOUT.dma", 3], ["F", "TEXLOAD_LAYOUT.bank", 4], ["F", "TEXLOAD_LAYOUT.layout_mode", 5, 6], ["F", "TEXLOAD_LAYOUT.s_addr_bits", 7, 8], ["F", "TEXLOAD_LAYOUT.t_addr_bits", 9, 10], ["F", "TEXLOAD_LAYOUT.interlaced_download", 11]]
[[claims]]
group = "kona-words"
label = "bind control"
doc = "docs/command-table.md"
regex = '\| (\d+):(\d+) filter-table slot \(sharpen and detail\); (\d+):(\d+) internal-format index.*?; (\d+):(\d+) mode \(3 = linear form.*?; (\d+):(\d+) target index'
binds = [["F", "BIND_CONTROL.filter_slot", 1, 2], ["F", "BIND_CONTROL.format_index", 3, 4], ["F", "BIND_CONTROL.mode", 5, 6], ["F", "BIND_CONTROL.target", 7, 8]]
[[claims]]
group = "kona-words"
label = "texture-mode word"
doc = "docs/command-table.md"
regex = '\| (\d+):(\d+) sampling mode \(.*?; (\d+):(\d+) minification filter.*?; (\d+):(\d+) magnification filter.*?; (\d+):(\d+) shadow comparison.*?; (\d+) clamp style.*?; (\d+) environment-on; (\d+):(\d+) texel format.*?; (\d+):(\d+) detail level.*?; (\d+):(\d+) channel-select field; (\d+):(\d+) magnification channels.*?; (\d+) first-level bank'
binds = [["F", "BIND_MODE.sampling", 1, 2], ["F", "BIND_MODE.min_filter", 3, 4], ["F", "BIND_MODE.mag_filter", 5, 6], ["F", "BIND_MODE.shadow_compare", 7, 8], ["F", "BIND_MODE.clamp_style", 9], ["F", "BIND_MODE.env_on", 10], ["F", "BIND_MODE.texel_format", 11, 12], ["F", "BIND_MODE.detail_level", 13, 14], ["F", "BIND_MODE.channel_select", 15, 16], ["F", "BIND_MODE.mag_channels", 17, 18], ["F", "BIND_MODE.first_bank", 19]]
[[claims]]
group = "kona-words"
label = "texture-size word"
doc = "docs/command-table.md"
regex = '\| (\d+):(\d+) s size exponent, (\d+):(\d+) t, (\d+):(\d+) r \(log2.*?; (\d+) s clamp.*?, (\d+) t clamp.*?, (\d+) r clamp'
binds = [["F", "BIND_SIZE.s_exp", 1, 2], ["F", "BIND_SIZE.t_exp", 3, 4], ["F", "BIND_SIZE.r_exp", 5, 6], ["F", "BIND_SIZE.s_clamp", 7], ["F", "BIND_SIZE.t_clamp", 8], ["F", "BIND_SIZE.r_clamp", 9]]
[[claims]]
group = "kona-words"
label = "LOD scales"
doc = "docs/command-table.md"
regex = 'LOD scales \| (\d+):(\d+) s, (\d+):(\d+) t, (\d+):(\d+) r'
binds = [["F", "BIND_LOD_SCALE.s_scale", 1, 2], ["F", "BIND_LOD_SCALE.t_scale", 3, 4], ["F", "BIND_LOD_SCALE.r_scale", 5, 6]]
[[claims]]
group = "kona-words"
label = "LOD bounds"
doc = "docs/command-table.md"
regex = 'LOD bounds \| (\d+):(\d+) minimum, (\d+):(\d+) maximum'
binds = [["F", "BIND_LOD_BOUNDS.min", 1, 2], ["F", "BIND_LOD_BOUNDS.max", 3, 4]]
[[claims]]
group = "kona-words"
label = "multisample control"
doc = "docs/command-table.md"
regex = 'bit 0 enable, bit (\d+) sample count.*?bit (\d+) mask operation.*?bits (\d+):(\d+) an 8-bit mask, bit (\d+) maintain-two, bits (\d+):(\d+) optimisation'
binds = [["F", "MS_CONTROL.sample_count", 1], ["F", "MS_CONTROL.mask_op", 2], ["F", "MS_CONTROL.mask", 3, 4], ["F", "MS_CONTROL.maintain_two", 5], ["F", "MS_CONTROL.optimisation", 6, 7]]
[[claims]]
group = "kona-words"
label = "pixel set-up word 0"
doc = "docs/command-table.md"
regex = '\| 0, bits (\d+):(\d+) \| transfer kind'
binds = [["F", "PIXEL_SETUP_W0.kind", 1, 2]]
